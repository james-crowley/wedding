<!doctype html>
<html lang="en" data-visualize-standalone>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob: data: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://esm.sh https://fonts.bunny.net https://fonts.googleapis.com https://fonts.gstatic.com https://unpkg.com; style-src 'unsafe-inline' blob: data: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://esm.sh https://fonts.bunny.net https://fonts.googleapis.com https://fonts.gstatic.com https://unpkg.com; img-src blob: data: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://esm.sh https://fonts.bunny.net https://fonts.googleapis.com https://fonts.gstatic.com https://unpkg.com; font-src blob: data: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://esm.sh https://fonts.bunny.net https://fonts.googleapis.com https://fonts.gstatic.com https://unpkg.com; media-src blob: data: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://esm.sh https://fonts.bunny.net https://fonts.googleapis.com https://fonts.gstatic.com https://unpkg.com; worker-src blob:; connect-src blob: data:; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Lakeside Estate · Wedding Studio</title>
<style>:root{color-scheme:light dark;background:light-dark(rgb(255 255 255), rgb(24 24 24))}html,body{margin:0}body{box-sizing:border-box;padding:0;background:inherit}iframe{display:block;width:100%;height:100vh;margin:0 auto;border:0}</style>

</head>
<body>
<iframe id="codex-visualization" sandbox="allow-scripts allow-downloads" referrerpolicy="no-referrer" title="Wedding Pavilion" data-srcdoc="__FRAME_HTML__"></iframe>

<script>(async () => {
  /* Bundled share tools */
  const frame = document.getElementById("codex-visualization");
  if (!(frame instanceof HTMLIFrameElement)) {
    return;
  }
  const isShare = document.documentElement.classList.contains(
    "visualization-share-root",
  );
  let viewportHeight = globalThis.innerHeight;
  let sizeFingerprint = null;
  let sizeWriteTimeout;
  let lastSize = null;
  let pendingSize = null;
  const legacyStorageKey = `codex:visualization-widget-state-v2:${JSON.stringify([
    globalThis.location.pathname,
    globalThis.location.search,
  ])}`;
  let storageKey = `codex:visualization-widget-state-v2:${JSON.stringify([globalThis.location.pathname, ""])}`;
  const sizeStorageKey = `${storageKey}:share-size-v1`;
  const parseState = (serializedState) => {
    if (
      typeof serializedState !== "string" ||
      new TextEncoder().encode(serializedState).length > 128 * 1024
    ) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 128 KiB",
      );
    }
    /** @type {unknown} */
    const state = JSON.parse(serializedState);
    if (
      state == null ||
      typeof state !== "object" ||
      Array.isArray(state) ||
      ("imageIds" in state &&
        (!Array.isArray(state.imageIds) || state.imageIds.length > 0))
    ) {
      throw new TypeError("Widget state must be a JSON object");
    }
    const storedState = { modelContent: null, privateContent: null, ...state };
    const canonicalState = JSON.stringify(
      storedState,
      (_key, /** @type {unknown} */ value) => {
        if (typeof value === "number" && !Number.isFinite(value)) {
          throw new TypeError("Widget state must contain finite numbers");
        }
        return value;
      },
    );
    if (new TextEncoder().encode(canonicalState).length > 128 * 1024) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 128 KiB",
      );
    }
    return storedState;
  };
  let storage = null;
  let state = null;
  try {
    const localStorage = globalThis.localStorage;
    const probeKey = `${storageKey}:probe`;
    localStorage.setItem(probeKey, "1");
    localStorage.removeItem(probeKey);
    storage = localStorage;
    let savedState = storage.getItem(storageKey) ?? storage.getItem(legacyStorageKey);
    if (savedState == null) {
      // Recover query-specific saves from an older release URL on this exact
      // path. Keep every legacy entry intact. Last-created key wins only when
      // there is no canonical/current-URL save; future saves use one stable key.
      const prefix = "codex:visualization-widget-state-v2:";
      for (let i = storage.length - 1; i >= 0; i--) {
        const key = storage.key(i);
        if (!key?.startsWith(prefix)) continue;
        try {
          const scope = JSON.parse(key.slice(prefix.length));
          if (!Array.isArray(scope) || scope.length !== 2 || scope[0] !== globalThis.location.pathname || typeof scope[1] !== "string") continue;
          const candidate = storage.getItem(key);
          parseState(candidate);
          savedState = candidate;
          break;
        } catch { /* Ignore unrelated/corrupt keys without deleting them. */ }
      }
    }
    if (savedState != null) {
      try {
        state = parseState(savedState);
      } catch {
        // Invalid saved state does not disable future writes.
      }
    }
  } catch {
    storage = null;
  }
  const persistSize = () => {
    globalThis.clearTimeout(sizeWriteTimeout);
    if (pendingSize == null) {
      return;
    }
    try {
      storage?.setItem(sizeStorageKey, pendingSize);
    } catch {
      // A denied or full cache must not affect the visualization.
    }
    pendingSize = null;
  };
  if (isShare) {
    globalThis.addEventListener("pagehide", persistSize);
  }
  let sharedDesign=null,linkedState=null;
  try {
    const token=VenueSharing.designToken(globalThis.location.hash);
    if(token!==null){
      const snapshot=await VenueSharing.decodeDesign(token);linkedState=VenueSharing.snapshotState(snapshot);
      storageKey=await VenueSharing.sharedStorageKey(storageKey,token);
      let copy=null;try{const saved=storage?.getItem(storageKey);if(saved)copy=parseState(saved);}catch{}
      state=copy||linkedState;sharedDesign={localCopy:Boolean(copy)};
    }
  }catch(error){const notice=document.createElement('p');notice.id='share-host-notice';notice.setAttribute('role','status');notice.style.cssText='margin:0;padding:14px 24px;background:#fff0cf;color:#503c20;font:14px/1.5 system-ui';notice.textContent='Could not open this design link. '+error.message+' Your own saved design is still available below.';document.body.prepend(notice);}
  // A second shared link can target this already-open page without a full
  // navigation. Reinitialize it rather than leaving the old design visible.
  const loadedHash=globalThis.location.hash;
  globalThis.addEventListener('hashchange',()=>{if(globalThis.location.hash.startsWith('#design=')||loadedHash.startsWith('#design='))globalThis.location.reload();});
  let lastShareUrl=null;
  const initialGlobals = {
    widgetState: state,
    sharedDesign,
    canShareDesign: typeof navigator.share==='function',
    viewportHeight: globalThis.innerHeight,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", async (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if(data.type==='design-share-request'){
      if(!Number.isSafeInteger(data.id)||data.id<=0)return;
      const reply=result=>channel.port1.postMessage({type:'design-share-result',id:data.id,...result});
      try{
        if(data.action==='create'){
          const token=await VenueSharing.encodeDesign(data.snapshot);lastShareUrl=VenueSharing.designLink(globalThis.location.href,token);let copied=false;
          try{if(navigator.userActivation?.isActive&&navigator.clipboard){await navigator.clipboard.writeText(lastShareUrl);copied=true;}}catch{}
          reply({ok:true,url:lastShareUrl,copied});
        }else if(data.action==='copy'&&lastShareUrl){
          if(navigator.userActivation?.isActive!==true)throw new Error('Click Copy link again to allow clipboard access.');
          try{await navigator.clipboard.writeText(lastShareUrl);reply({ok:true,url:lastShareUrl,copied:true});}catch{reply({ok:true,url:lastShareUrl,copied:false});}
        }else if(data.action==='native'&&lastShareUrl){
          if(navigator.userActivation?.isActive!==true)throw new Error('Click Share again to open your device’s share menu.');
          if(typeof navigator.share!=='function')throw new Error('Select Copy link to share this design.');
          try{await navigator.share({title:'Wedding design',url:lastShareUrl});reply({ok:true,url:lastShareUrl,shared:true});}catch(error){if(error.name==='AbortError')reply({ok:true,url:lastShareUrl,canceled:true});else throw error;}
        }else if(data.action==='personal'&&sharedDesign&&navigator.userActivation?.isActive){const url=new URL(location.href);url.hash='';location.assign(url.href);}
        else if(data.action==='original'&&sharedDesign&&navigator.userActivation?.isActive){storage?.removeItem(storageKey);location.reload();}
        else throw new Error('Create a design link first.');
      }catch(error){reply({ok:false,error:error.message||'The share link could not be created.'});}
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "download-file") {
      const types = {
        "venue-design.png": "image/png",
        "venue-planning-brief.html": "text/html",
        "venue-pavilion-layout.json": "application/json",
        "wedding-rental-shortlist.csv": "text/csv;charset=utf-8",
      };
      if (!Object.hasOwn(types, data.name) || types[data.name] !== data.mime || !(data.bytes instanceof Uint8Array) || data.bytes.byteLength > 16 * 1024 * 1024) return;
      const url = URL.createObjectURL(new Blob([data.bytes], { type: data.mime }));
      const anchor = document.createElement("a");
      anchor.href = url;
      anchor.download = data.name;
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
      globalThis.setTimeout(() => URL.revokeObjectURL(url), 30_000);
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height !== "number" ||
        !Number.isFinite(height) ||
        height < 0
      ) {
        return;
      }
      if (height <= 10_000) {
        const width = isShare && storage != null ? frame.clientWidth : null;
        frame.style.height = Math.ceil(height) + "px";
        if (isShare && storage != null) {
          const size = JSON.stringify({
            fingerprint: sizeFingerprint,
            width,
            viewportHeight: globalThis.innerHeight,
            dark: globalThis.matchMedia("(prefers-color-scheme: dark)").matches,
            scale: globalThis.devicePixelRatio,
            height: Math.ceil(height),
          });
          if (size !== lastSize) {
            lastSize = size;
            pendingSize = size;
            globalThis.clearTimeout(sizeWriteTimeout);
            sizeWriteTimeout = globalThis.setTimeout(persistSize, 100);
          }
        }
      }
      if (isShare) {
        // Keep unusually tall content accessible without accepting an unbounded height.
        if (height > 10_000 && Number.parseFloat(frame.style.height) === 0) {
          frame.style.removeProperty("height");
        }
        frame.scrolling = height > 10_000 ? "auto" : "no";
        document.documentElement.classList.add("visualization-share-ready");
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!isShare && (!Number.isFinite(height) || height <= viewportHeight)) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure", viewportHeight: globalThis.innerHeight });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  const frameHtml = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  if (isShare && storage != null) {
    // Fingerprint the rendered document, including restored widget state, without
    // storing its content. This is a layout cache, not a security identity.
    let hash = 5381;
    for (let index = 0; index < frameHtml.length; index += 1) {
      hash = (hash * 33 + frameHtml.charCodeAt(index)) % 4_294_967_296;
    }
    sizeFingerprint = hash.toString(36);
    try {
      const size = JSON.parse(storage.getItem(sizeStorageKey) ?? "null");
      if (
        size?.fingerprint === sizeFingerprint &&
        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===
          globalThis.matchMedia("(prefers-color-scheme: dark)").matches &&
        size.scale === globalThis.devicePixelRatio &&
        typeof size.height === "number" &&
        Number.isFinite(size.height) &&
        size.height >= 0 &&
        size.height <= 10_000
      ) {
        frame.style.height = size.height + "px";
      }
    } catch {
      // Ignore missing or invalid cache entries and measure the live frame.
    }
  }
  frame.srcdoc = frameHtml;
  delete frame.dataset.srcdoc;
})();
</script>
</body>
</html>
