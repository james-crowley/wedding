version: 2.1

executors:
  browser:
    docker:
      - image: mcr.microsoft.com/playwright:v1.64.1-noble
    resource_class: medium
    environment:
      CI: "true"

jobs:
  build-and-unit:
    executor: browser
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-npm-pw1641-{{ arch }}-{{ checksum "package-lock.json" }}
            - v1-npm-pw1641-{{ arch }}-
      - run:
          name: Install locked dependencies using the npm download cache
          command: npm ci --prefer-offline --no-audit --fund=false
      - save_cache:
          key: v1-npm-pw1641-{{ arch }}-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Classify changes against the published source or PR merge base
          command: node scripts/ci-plan.mjs prepare
      - run:
          name: Build, unit-test and collect browser inventory concurrently
          command: npm run check:static -- --inventory
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: dist
          destination: site
      - store_artifacts:
          path: .ci
          destination: ci-plan
      - persist_to_workspace:
          root: .
          paths:
            - dist
            - node_modules
            - .ci

  browser-tests:
    executor: browser
    parallelism: 8
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Skip browsers for verified documentation-only changes
          command: node scripts/ci-plan.mjs halt-if-docs
      - run:
          name: Run this browser shard with one WebGL worker
          command: node scripts/ci-browser.mjs run
          no_output_timeout: 10m
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: playwright-report
          destination: browser-report
      - store_artifacts:
          path: test-results
          destination: test-results
      - persist_to_workspace:
          root: .
          paths:
            - ci-shards

  verify-browser-tests:
    executor: browser
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Skip report merging for documentation-only changes
          command: node scripts/ci-plan.mjs halt-if-docs
      - run:
          name: Merge reports and require every collected test to pass
          command: node scripts/ci-browser.mjs merge
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: playwright-report
          destination: combined-browser-report
      - store_artifacts:
          path: .ci/browser-proof.json
          destination: browser-proof.json
      - persist_to_workspace:
          root: .
          paths:
            - .ci/browser-proof.json

  publish-pages:
    executor: browser
    environment:
      GH_PAGES_SSH_FINGERPRINT: "73:b4:47:ae:8d:1f:44:f4:26:49:d0:e9:bf:65:e1:23"
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Skip publication when only documentation changed
          command: node scripts/ci-plan.mjs halt-if-docs
      - add_ssh_keys:
          fingerprints:
            - "73:b4:47:ae:8d:1f:44:f4:26:49:d0:e9:bf:65:e1:23"
      - run:
          name: Publish the exact build validated by all browser shards
          command: node scripts/deploy-pages.mjs

workflows:
  build-test-publish:
    jobs:
      - build-and-unit:
          filters:
            branches:
              ignore: gh-pages
      - browser-tests:
          requires:
            - build-and-unit
          filters:
            branches:
              ignore: gh-pages
      - verify-browser-tests:
          requires:
            - browser-tests
          filters:
            branches:
              ignore: gh-pages
      - publish-pages:
          context: wedding-pages
          serial-group: << pipeline.project.slug >>/github-pages
          requires:
            - verify-browser-tests
          filters:
            branches:
              only: main
